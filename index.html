<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision | OAuth 2.0 PKCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen font-sans p-4">

    <div id="auth-screen" class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700 text-center">
        <h1 class="text-3xl font-black italic mb-2 uppercase">Expert <span class="text-cyan-400">Vision</span></h1>
        <p class="text-slate-500 text-[10px] mb-8 font-bold tracking-widest uppercase">Tecnologia OAuth 2.0 + PKCE</p>
        
        <button onclick="iniciarFluxoOAuth()" class="w-full py-4 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold uppercase transition-all shadow-lg flex items-center justify-center gap-3">
            <i class="fab fa-buffer"></i> Conectar via Deriv Oficial
        </button>
        <p class="text-[9px] text-slate-500 mt-4 italic text-balance">O login é processado nos servidores da Deriv. Suas credenciais estão 100% seguras.</p>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl animate-fadeIn space-y-6">
        <header class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-cyan-500/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-chart-line text-cyan-400 text-xl"></i>
                </div>
                <div>
                    <span id="account-badge" class="text-[10px] font-bold text-green-400 uppercase tracking-widest">• Validado</span>
                    <h2 id="balance-display" class="text-3xl font-black font-mono">$ 0.00</h2>
                </div>
            </div>
            <button onclick="logout()" class="text-xs font-bold text-red-500 hover:bg-red-500/10 px-4 py-2 rounded-lg transition">SAIR</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center">
                <p class="text-xs text-slate-500 font-bold uppercase mb-2">Status do Robô</p>
                <p class="text-cyan-400 font-black">AGUARDANDO COMANDO</p>
            </div>
            </div>
    </div>

    <script>
        const CLIENT_ID = '33e1UPy4LXVMuK8F8PU3t';
        const REDIRECT_URI = window.location.href.split('?')[0];

        // --- ETAPA 1: GERAR PKCE (CONFORME O GUIA) ---
        async function gerarDesafioPKCE() {
            const array = crypto.getRandomValues(new Uint8Array(64));
            const codeVerifier = Array.from(array)
                .map(v => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[v % 66])
                .join('');

            const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier));
            const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            const state = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                .map(b => b.toString(16).padStart(2, '0')).join('');

            sessionStorage.setItem('pkce_code_verifier', codeVerifier);
            sessionStorage.setItem('oauth_state', state);

            return { codeChallenge, state };
        }

        // --- ETAPA 2: REDIRECIONAR (CONFORME O GUIA) ---
        async function iniciarFluxoOAuth() {
            const { codeChallenge, state } = await gerarDesafioPKCE();
            const authUrl = `https://auth.deriv.com/oauth2/auth?` + 
                `response_type=code` +
                `&client_id=${CLIENT_ID}` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&scope=trade+account_manage+payments` +
                `&state=${state}` +
                `&code_challenge=${codeChallenge}` +
                `&code_challenge_method=S256`;
            
            window.location.href = authUrl;
        }

        // --- ETAPA 3 E 4: LIDAR COM O RETORNO E TROCAR CÓDIGO ---
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const returnedState = params.get('state');
            const storedState = sessionStorage.getItem('oauth_state');
            const codeVerifier = sessionStorage.getItem('pkce_code_verifier');

            if (code) {
                // Validação de segurança State (conforme o guia)
                if (returnedState !== storedState) {
                    alert("Erro de segurança: State inválido!");
                    return;
                }

                document.getElementById('auth-screen').innerHTML = `<div class="animate-pulse text-cyan-400 font-bold uppercase">Trocando Código por Token...</div>`;

                // Troca de Token (O guia sugere backend, mas a Deriv permite via WS com PKCE para Apps Front-end)
                autenticarViaWS(code, codeVerifier);
            }
        };

        function autenticarViaWS(code, verifier) {
            const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${CLIENT_ID}`);

            ws.onopen = () => {
                // No fluxo PKCE da Deriv, você pode enviar o código de autorização diretamente no authorize
                ws.send(JSON.stringify({ 
                    authorize: code, // A API da Deriv aceita o code aqui no fluxo OAuth
                    code_verifier: verifier 
                }));
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);

                if (data.error) {
                    alert("Erro na troca de token: " + data.error.message);
                    window.location.href = REDIRECT_URI;
                    return;
                }

                if (data.msg_type === 'authorize') {
                    // SUCESSO!
                    sessionStorage.removeItem('pkce_code_verifier');
                    sessionStorage.removeItem('oauth_state');
                    
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    
                    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                }

                if (data.msg_type === 'balance') {
                    document.getElementById('balance-display').innerText = `$ ${data.balance.balance.toFixed(2)}`;
                }
            };
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = REDIRECT_URI;
        }
    </script>
</body>
</html>
