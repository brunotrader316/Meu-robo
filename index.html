<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Vision Pro | Deriv Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .side-panel { background: #0f172a; border-right: 1px solid #1e293b; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .input-dark { background: #020617; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; width: 100%; outline: none; }
        .btn-run { background: linear-gradient(to right, #06b6d4, #3b82f6); color: white; font-weight: 900; transition: 0.3s; cursor: pointer; }
        .btn-run:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="h-16 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between px-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-cyan-500 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fas fa-microchip text-slate-900 text-xl"></i>
            </div>
            <h1 class="text-xl font-black italic tracking-tighter">EXPERT <span class="text-cyan-400">VISION</span></h1>
        </div>
        <div class="flex items-center gap-8">
            <div class="text-right">
                <span id="acc-status" class="text-[10px] font-bold text-red-500 uppercase tracking-widest">• Desconectado</span>
                <p id="balance-display" class="text-xl font-mono font-bold">$ 0.00</p>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-80 side-panel p-6 overflow-y-auto space-y-6">
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-slate-500 uppercase">Autenticação</h3>
                <button id="btn-login" onclick="iniciarLoginDeriv()" class="input-dark text-sm bg-slate-800 hover:bg-slate-700 text-cyan-400 border-cyan-500/50 flex items-center justify-center gap-2">
                    <i class="fab fa-dyalog"></i> CONECTAR CONTA DERIV
                </button>
                <div id="user-info" class="hidden text-[10px] text-green-400 italic text-center">✓ Autenticado</div>
                
                <h3 class="text-xs font-bold text-slate-500 uppercase pt-2">Estratégia DIF GALE</h3>
                <div>
                    <label class="text-[10px] text-slate-400 uppercase">Mercado</label>
                    <select id="market" class="input-dark mt-1 text-sm">
                        <option value="1HZ100V" selected>Volatility 100 (1s)</option>
                        <option value="1HZ10V">Volatility 10 (1s)</option>
                        <option value="R_100">Volatility 100 Index</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase">Entrada ($)</label>
                        <input id="stake" type="number" value="0.35" class="input-dark">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase">Dígito Alvo</label>
                        <input id="prediction" type="number" value="9" max="9" min="0" class="input-dark">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] text-slate-400 uppercase">V-Loss (Sequência)</label>
                    <input id="v-loss-limit" type="number" value="3" class="input-dark border-cyan-500/30">
                </div>

                <div class="pt-4">
                    <button id="btn-action" onclick="toggleBot()" class="w-full py-4 rounded-xl btn-run uppercase text-sm">
                        <i class="fas fa-play mr-2"></i> Iniciar Robô
                    </button>
                </div>
            </div>
        </aside>

        <section class="flex-1 p-6 flex flex-col gap-6 overflow-hidden">
            <div class="flex-[2] stat-card overflow-hidden relative">
                <div id="tradingview_chart" class="h-full w-full"></div>
            </div>

            <div class="flex-1 flex gap-6">
                <div class="w-64 flex flex-col gap-3">
                    <div class="stat-card p-4 flex justify-between items-center">
                        <span class="text-xs text-slate-400 uppercase">Wins</span>
                        <span id="wins" class="text-xl font-bold text-green-400">0</span>
                    </div>
                    <div class="stat-card p-4 flex justify-between items-center">
                        <span class="text-xs text-slate-400 uppercase">Losses</span>
                        <span id="losses" class="text-xl font-bold text-red-400">0</span>
                    </div>
                    <div class="stat-card p-4 flex flex-col items-center justify-center bg-cyan-950/20">
                        <span id="v-counter" class="text-3xl font-black text-white">0</span>
                        <span class="text-[10px] text-cyan-400 uppercase font-bold">Contador V-Loss</span>
                    </div>
                </div>
                <div class="flex-1 stat-card p-4 flex flex-col">
                    <h4 class="text-[10px] font-bold text-slate-500 uppercase mb-2 border-b border-slate-700 pb-1">Logs</h4>
                    <div id="logs" class="flex-1 overflow-y-auto text-[11px] font-mono space-y-1"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Configurações Alinhadas com o Painel
        const CLIENT_ID = '33ez5W6537WKkpVzEfRAo';
        const REDIRECT_URI = 'https://brunotrader316.github.io/Meu-robo';
        
        let ws, running = false, vCounter = 0, stakeOriginal = 0, currentStake = 0, accessToken = null;

        function log(msg, color) {
            const logs = document.getElementById('logs');
            if(!logs) return;
            const div = document.createElement('div');
            div.className = `border-b border-slate-800 ${color}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.prepend(div);
        }

        async function iniciarLoginDeriv() {
            // PKCE Flow
            const verifier = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const challenge = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const state = crypto.randomUUID();
            
            sessionStorage.setItem('code_verifier', verifier);
            sessionStorage.setItem('oauth_state', state);
            
            // Escopo 'read' corrigido para evitar invalid_scope
            const authUrl = `https://auth.deriv.com/oauth2/auth?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=trade+read&state=${state}&code_challenge=${challenge}&code_challenge_method=S256`;
            window.location.href = authUrl;
        }

        async function verificarLogin() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');

            if (code && state === sessionStorage.getItem('oauth_state')) {
                log("Validando autorização...", "text-cyan-400");
                try {
                    const resp = await fetch('https://auth.deriv.com/oauth2/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            grant_type: 'authorization_code',
                            client_id: CLIENT_ID,
                            code: code,
                            redirect_uri: REDIRECT_URI,
                            code_verifier: sessionStorage.getItem('code_verifier')
                        })
                    });
                    const data = await resp.json();
                    if (data.access_token) {
                        accessToken = data.access_token;
                        document.getElementById('btn-login').style.display = 'none';
                        document.getElementById('user-info').classList.remove('hidden');
                        window.history.replaceState({}, '', window.location.pathname);
                        log("Conexão estabelecida!", "text-green-400");
                        conectarWS();
                    } else {
                        log("Erro no token: " + (data.error_description || data.error), "text-red-500");
                    }
                } catch (e) {
                    log("Erro de comunicação.", "text-red-500");
                }
            }
        }

        function conectarWS() {
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${CLIENT_ID}`);
            ws.onopen = () => ws.send(JSON.stringify({ authorize: accessToken }));
            ws.onmessage = (msg) => {
                const d = JSON.parse(msg.data);
                if (d.msg_type === 'authorize') {
                    document.getElementById('acc-status').innerText = d.authorize.is_virtual ? "• CONTA DEMO" : "• CONTA REAL";
                    document.getElementById('acc-status').style.color = d.authorize.is_virtual ? "#22c55e" : "#f97316";
                    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                }
                if (d.msg_type === 'balance') {
                    document.getElementById('balance-display').innerText = `$ ${d.balance.balance.toFixed(2)}`;
                }
                if (d.msg_type === 'tick' && running) {
                    const lastDigit = d.tick.quote.toString().slice(-1);
                    if (lastDigit == document.getElementById('prediction').value) {
                        vCounter++;
                        document.getElementById('v-counter').innerText = vCounter;
                        log(`Alvo detectado: ${lastDigit} (${vCounter})`, "text-orange-400");
                    }
                    if (vCounter >= document.getElementById('v-loss-limit').value) {
                        vCounter = 0;
                        document.getElementById('v-counter').innerText = "0";
                        executarCompra();
                    }
                }
                if (d.msg_type === 'proposal_open_contract' && d.proposal_open_contract.is_settled) {
                    if (d.proposal_open_contract.status === 'won') {
                        document.getElementById('wins').innerText = parseInt(document.getElementById('wins').innerText) + 1;
                        currentStake = stakeOriginal;
                        log("WIN! Resetando stake.", "text-green-400 font-bold");
                    } else {
                        document.getElementById('losses').innerText = parseInt(document.getElementById('losses').innerText) + 1;
                        currentStake *= 11;
                        log(`LOSS! Próximo Gale: $${currentStake.toFixed(2)}`, "text-red-400 font-bold");
                    }
                }
            };
        }

        function executarCompra() {
            log("Executando Ordem Real...", "text-white bg-blue-600 px-2 rounded");
            ws.send(JSON.stringify({
                buy: 1,
                price: currentStake * 1.2,
                parameters: {
                    amount: currentStake,
                    basis: 'stake',
                    contract_type: 'DIGITDIFF',
                    currency: 'USD',
                    duration: 1,
                    duration_unit: 't',
                    symbol: document.getElementById('market').value,
                    barrier: document.getElementById('prediction').value
                },
                subscribe: 1
            }));
        }

        function toggleBot() {
            if (!accessToken) return alert("Por favor, conecte a sua conta primeiro!");
            running = !running;
            if (running) {
                stakeOriginal = parseFloat(document.getElementById('stake').value);
                currentStake = stakeOriginal;
                ws.send(JSON.stringify({ ticks: document.getElementById('market').value, subscribe: 1 }));
                document.getElementById('btn-action').innerText = "PARAR ROBÔ";
                document.getElementById('btn-action').style.background = "#dc2626";
                log("Estratégia iniciada.", "text-yellow-400");
            } else {
                location.reload();
            }
        }

        window.onload = () => {
            verificarLogin();
            new TradingView.widget({
                "autosize": true,
                "symbol": "DERIV:VOLATILITY_100_INDEX",
                "interval": "1",
                "theme": "dark",
                "container_id": "tradingview_chart"
            });
        };
    </script>
</body>
</html>
