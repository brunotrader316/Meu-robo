<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision | Neural Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(34, 211, 238, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        .btn-primary { background: linear-gradient(135deg, #0891b2 0%, #2563eb 100%); transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(8, 145, 178, 0.4); }
        .terminal { background: #010409; font-family: 'Fira Code', monospace; font-size: 11px; height: 200px; border: 1px solid #1e293b; }
        .input-cyber { background: #010409; border: 1px solid #1e3a5f; color: #22d3ee; outline: none; transition: 0.3s; }
        .input-cyber:focus { border-color: #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <div class="w-full max-w-5xl grid grid-cols-12 gap-6 h-[90vh]">
        
        <aside class="col-span-12 lg:col-span-4 flex flex-col gap-4">
            <div class="glass p-6 rounded-3xl flex-1 flex flex-col gap-5">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-12 h-12 bg-cyan-500/20 rounded-2xl flex items-center justify-center border border-cyan-500/30">
                        <i class="fas fa-robot text-cyan-400 text-2xl neon-text"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black italic uppercase tracking-tighter">Expert <span class="text-cyan-400">Vision</span></h1>
                        <p class="text-[8px] text-slate-500 font-bold tracking-[0.3em] uppercase">Intelligence System</p>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 font-black uppercase ml-1 tracking-widest">Acesso à API</label>
                    <div class="relative">
                        <input id="api-token" type="password" placeholder="Insira seu Token da Deriv" class="input-cyber w-full p-4 rounded-xl text-xs pr-12">
                        <button onclick="validarToken()" class="absolute right-3 top-3 text-cyan-500 hover:text-cyan-300">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div id="token-status" class="flex items-center gap-2 px-1">
                        <div id="status-led" class="w-2 h-2 rounded-full bg-slate-700"></div>
                        <span id="status-text" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Aguardando Token</span>
                    </div>
                </div>

                <div class="space-y-4 pt-2">
                    <div>
                        <label class="text-[10px] text-slate-400 font-black uppercase ml-1">Estratégia</label>
                        <select id="strategy" class="input-cyber w-full p-3 rounded-xl text-xs mt-1">
                            <option value="diff">Dígitos Diferentes (DIFERENTE DE)</option>
                            <option value="match">Dígitos Iguais (COMBINA COM)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-400 font-black uppercase ml-1">Entrada ($)</label>
                            <input id="stake" type="number" value="0.35" class="input-cyber w-full p-3 rounded-xl text-xs mt-1">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 font-black uppercase ml-1">V-Loss</label>
                            <input id="v-limit" type="number" value="3" class="input-cyber w-full p-3 rounded-xl text-xs mt-1">
                        </div>
                    </div>
                </div>

                <button id="btn-main" onclick="toggleBot()" class="btn-primary w-full py-5 rounded-2xl font-black uppercase text-sm mt-auto shadow-lg">
                    <i class="fas fa-play mr-2"></i> Iniciar Algoritmo
                </button>
            </div>
        </aside>

        <main class="col-span-12 lg:col-span-8 flex flex-col gap-4">
            <div class="grid grid-cols-3 gap-4">
                <div class="glass p-5 rounded-3xl text-center border-b-2 border-green-500/30">
                    <p class="text-[9px] text-slate-500 font-black uppercase mb-1">Total Wins</p>
                    <h4 id="wins" class="text-3xl font-black text-white">0</h4>
                </div>
                <div class="glass p-5 rounded-3xl text-center border-b-2 border-red-500/30">
                    <p class="text-[9px] text-slate-500 font-black uppercase mb-1">Total Losses</p>
                    <h4 id="losses" class="text-3xl font-black text-white">0</h4>
                </div>
                <div class="glass p-5 rounded-3xl text-center border-b-2 border-cyan-500/30">
                    <p class="text-[9px] text-slate-500 font-black uppercase mb-1">Saldo Atual</p>
                    <h4 id="balance" class="text-3xl font-black text-cyan-400 font-mono">$ 0.00</h4>
                </div>
            </div>

            <div class="glass p-6 rounded-3xl flex-1 flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-500 animate-ping"></span> Console de Operações
                    </h3>
                    <div class="flex gap-2">
                        <span id="v-counter-badge" class="bg-cyan-500/10 text-cyan-400 text-[10px] px-3 py-1 rounded-full font-bold border border-cyan-500/20">V-LOSS: 0</span>
                    </div>
                </div>
                <div id="logs" class="terminal p-4 rounded-xl overflow-y-auto space-y-2 flex-1">
                    <div class="text-slate-600 italic">> Aguardando inicialização do sistema...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let ws, running = false, vCounter = 0;
        const APP_ID = '33e1UPy4LXVMuK8F8PU3t';

        function addLog(msg, color = 'text-slate-400') {
            const logs = document.getElementById('logs');
            const d = document.createElement('div');
            d.className = `${color} border-l border-slate-800 pl-3 py-1`;
            d.innerHTML = `<span class="text-slate-700 mr-2">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logs.prepend(d);
        }

        function validarToken() {
            const token = document.getElementById('api-token').value;
            if(!token) return;

            addLog("Validando Token...", "text-yellow-500");
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
            
            ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));
            
            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if(data.error) {
                    document.getElementById('status-led').className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_red]";
                    document.getElementById('status-text').innerText = "TOKEN INVÁLIDO";
                    document.getElementById('status-text').className = "text-[9px] font-bold text-red-500 uppercase tracking-widest";
                    addLog("ERRO: Token recusado pela Deriv.", "text-red-500");
                    return;
                }
                if(data.msg_type === 'authorize') {
                    document.getElementById('status-led').className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]";
                    document.getElementById('status-text').innerText = data.authorize.is_virtual ? "CONTA DEMO ATIVA" : "CONTA REAL ATIVA";
                    document.getElementById('status-text').className = "text-[9px] font-bold text-green-500 uppercase tracking-widest";
                    document.getElementById('balance').innerText = `$ ${data.authorize.balance.toFixed(2)}`;
                    addLog("Sucesso! Conexão estabelecida.", "text-green-400");
                }
            };
        }

        function toggleBot() {
            if(!running) {
                const token = document.getElementById('api-token').value;
                if(!token) return alert("Insira o Token primeiro!");
                running = true;
                document.getElementById('btn-main').innerText = "PARAR ALGORITMO";
                document.getElementById('btn-main').className = "w-full py-5 rounded-2xl bg-red-600 font-black uppercase text-sm mt-auto shadow-lg shadow-red-900/20";
                addLog("Analisando mercado...", "text-cyan-400");
                // Lógica de ticks e entradas aqui...
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
