<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision | Operacional PKCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid #1e3a5f; }
        .btn-glow { background: linear-gradient(135deg, #0891b2 0%, #2563eb 100%); transition: 0.3s; cursor: pointer; font-weight: bold; }
        .hidden-step { display: none !important; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div id="auth-card" class="w-full max-w-md glass p-10 rounded-[2.5rem] text-center border-t-4 border-cyan-500">
        <h1 class="text-2xl font-black italic uppercase mb-2">Expert <span class="text-cyan-400">Vision</span></h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-8">OAuth2 + PKCE System</p>

        <div id="setup-area" class="space-y-4">
            <button onclick="iniciarFluxoDeriv()" class="btn-glow w-full py-4 rounded-xl uppercase text-xs text-white">
                Autorizar com Deriv
            </button>
            <div id="status-msg" class="text-[10px] text-slate-400 font-mono italic">Aguardando início...</div>
        </div>
    </div>

    <div id="robot-ui" class="hidden-step w-full max-w-lg glass p-8 rounded-3xl text-center">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-xs font-bold text-green-400">SISTEMA ATIVO</span>
            </div>
            <h2 id="balance-display" class="text-2xl font-mono font-black">$ 0.00</h2>
        </div>
        <button class="btn-glow w-full py-4 rounded-xl uppercase">Iniciar Operações</button>
    </div>

    <script>
        // CONFIGURAÇÕES
        const CLIENT_ID = '33e1UPy4LXVMuK8F8PU3t';
        const REDIRECT_URI = 'https://brunotrader316.github.io/Meu-robo';
        const AUTH_URL = 'https://auth.deriv.com/oauth2/auth';
        const TOKEN_URL = 'https://auth.deriv.com/oauth2/token';

        // ETAPA 1: GERAR PARÂMETROS PKCE (Scripts que você enviou)
        async function gerarParametrosPKCE() {
            // 1. Generate code_verifier
            const array = crypto.getRandomValues(new Uint8Array(64));
            const codeVerifier = Array.from(array)
                .map(v => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[v % 66])
                .join('');

            // 2. Derive code_challenge
            const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier));
            const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            // 3. Generate state
            const state = crypto.getRandomValues(new Uint8Array(16))
                .reduce((s, b) => s + b.toString(16).padStart(2, '0'), '');

            return { codeVerifier, codeChallenge, state };
        }

        // ETAPA 2: REDIRECIONAR PARA DERIV
        async function iniciarFluxoDeriv() {
            updateStatus("Gerando chaves de segurança PKCE...");
            const pkce = await gerarParametrosPKCE();

            // 4. Store code_verifier and state (Sua regra de sessionStorage)
            sessionStorage.setItem('pkce_code_verifier', pkce.codeVerifier);
            sessionStorage.setItem('oauth_state', pkce.state);

            const params = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                redirect_uri: REDIRECT_URI,
                scope: 'trade account_manage',
                state: pkce.state,
                code_challenge: pkce.codeChallenge,
                code_challenge_method: 'S256'
            });

            window.location.href = `${AUTH_URL}?${params.toString()}`;
        }

        // ETAPA 3 & 4: LIDAR COM O RETORNO E TROCAR CÓDIGO POR TOKEN
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const returnedState = urlParams.get('state');
            const storedState = sessionStorage.getItem('oauth_state');
            const codeVerifier = sessionStorage.getItem('pkce_code_verifier');

            if (code) {
                // ETAPA 3.1: Verificar Estado (Proteção CSRF)
                if (returnedState !== storedState) {
                    updateStatus("ERRO: Estado de segurança inválido!");
                    return;
                }

                updateStatus("Código recebido. Trocando por token...");
                trocarCodigoPorToken(code, codeVerifier);
            }
        };

        async function trocarCodigoPorToken(code, verifier) {
            try {
                const response = await fetch(TOKEN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        client_id: CLIENT_ID,
                        code: code,
                        code_verifier: verifier,
                        redirect_uri: REDIRECT_URI
                    })
                });

                const data = await response.json();

                if (data.access_token) {
                    updateStatus("Autenticado com sucesso!");
                    // Limpa dados sensíveis do storage como instruído
                    sessionStorage.removeItem('pkce_code_verifier');
                    sessionStorage.removeItem('oauth_state');
                    
                    iniciarInterfaceRobo(data.access_token);
                } else {
                    updateStatus("Erro ao obter token: " + (data.error || "Desconhecido"));
                }
            } catch (err) {
                updateStatus("Erro de conexão no servidor de tokens.");
            }
        }

        function iniciarInterfaceRobo(token) {
            document.getElementById('auth-card').classList.add('hidden-step');
            document.getElementById('robot-ui').classList.remove('hidden-step');
            
            // Conectar via WebSocket para pegar saldo usando o Bearer Token
            const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${CLIENT_ID}`);
            ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));
            ws.onmessage = (msg) => {
                const res = JSON.parse(msg.data);
                if (res.msg_type === 'authorize') {
                    document.getElementById('balance-display').innerText = `$ ${res.authorize.balance}`;
                }
            };
        }

        function updateStatus(txt) {
            document.getElementById('status-msg').innerText = txt;
        }
    </script>
</body>
</html>
