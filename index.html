<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision Pro | Autenticação Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#020617] text-white flex items-center justify-center min-h-screen p-4 font-sans">

    <div id="auth-card" class="bg-[#0f172a] p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800 text-center">
        <div class="mb-8">
            <div class="w-16 h-16 bg-cyan-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-cyan-500/30">
                <i class="fas fa-shield-check text-cyan-400 text-3xl"></i>
            </div>
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">Expert <span class="text-cyan-400">Vision</span></h1>
            <p class="text-[10px] text-slate-500 font-bold mt-2 uppercase tracking-widest font-mono">Terminal de Autenticação PKCE</p>
        </div>

        <button onclick="conectarDeriv()" class="w-full py-4 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold uppercase transition-all flex items-center justify-center gap-3 shadow-lg shadow-cyan-900/20 border-b-4 border-cyan-700">
            <i class="fab fa-buffer"></i> Login Seguro via Deriv
        </button>

        <div class="mt-8 pt-6 border-t border-slate-800">
            <p class="text-[9px] text-slate-500 uppercase font-black mb-2 tracking-tighter text-left">Status da Conexão:</p>
            <div class="flex items-center gap-2 text-left bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                <div id="led" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                <span id="status-msg" class="text-[10px] font-mono text-slate-400 uppercase">Aguardando autorização...</span>
            </div>
        </div>
    </div>

    <script>
        // Configurações Oficiais
        const CLIENT_ID = '33e1UPy4LXVMuK8F8PU3t';
        const REDIRECT_URI = 'https://brunotrader316.github.io/Meu-robo';

        async function gerarPKCE() {
            const array = crypto.getRandomValues(new Uint8Array(64));
            const verifier = Array.from(array)
                .map(v => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[v % 66])
                .join('');

            const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
            const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

            const state = Math.random().toString(36).substring(2);

            sessionStorage.setItem('pkce_code_verifier', verifier);
            sessionStorage.setItem('oauth_state', state);

            return { challenge, state };
        }

        async function conectarDeriv() {
            const { challenge, state } = await gerarPKCE();
            
            // URL de autorização conforme o manual técnico OAuth 2.0
            const authUrl = `https://auth.deriv.com/oauth2/auth?` + 
                `response_type=code` +
                `&client_id=${CLIENT_ID}` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&scope=trade+account_manage+payments` +
                `&state=${state}` +
                `&code_challenge=${challenge}` +
                `&code_challenge_method=S256`;
            
            window.location.href = authUrl;
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');

            if (error) {
                document.getElementById('status-msg').innerText = "ERRO: " + params.get('error_description');
                document.getElementById('status-msg').className = "text-[10px] font-mono text-red-500 uppercase";
                document.getElementById('led').className = "w-2 h-2 rounded-full bg-red-600";
            }

            if (code) {
                document.getElementById('status-msg').innerText = "CONECTADO! TROCANDO TOKEN...";
                document.getElementById('status-msg').className = "text-[10px] font-mono text-cyan-400 uppercase";
                document.getElementById('led').className = "w-2 h-2 rounded-full bg-cyan-400 animate-pulse";
                // Aqui o sistema prossegue para carregar o seu robô Expert Vision
            }
        };
    </script>
</body>
</html>
