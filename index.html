<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision | Autenticação Automática</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen font-sans">

    <div id="auth-card" class="bg-slate-800 p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700 text-center">
        <h1 class="text-3xl font-black italic mb-2">EXPERT <span class="text-cyan-400">VISION</span></h1>
        <p class="text-slate-400 text-xs mb-8 uppercase tracking-widest">Conexão Segura Oficial</p>

        <div id="login-section">
            <button onclick="iniciarLogin()" class="w-full py-4 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold uppercase transition shadow-lg">
                <i class="fas fa-sign-in-alt mr-2"></i> Entrar com Deriv.com
            </button>
            <p class="text-[10px] text-slate-500 mt-4 italic">Você será redirecionado para o login seguro da corretora.</p>
        </div>

        <div id="loading-section" class="hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-400 mx-auto mb-4"></div>
            <p class="text-cyan-400 font-bold uppercase text-xs">Sincronizando Conta...</p>
        </div>
    </div>

    <div id="dashboard" class="hidden w-full max-w-4xl p-6 animate-fadeIn">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex justify-between items-center shadow-2xl">
            <div>
                <p id="acc-type" class="text-[10px] font-bold text-green-400 uppercase tracking-widest">Conectado</p>
                <h2 id="balance-display" class="text-4xl font-black font-mono mt-1">$ 0.00</h2>
            </div>
            <button onclick="logout()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white transition">
                SAIR
            </button>
        </div>
    </div>

    <script>
        const APP_ID = '33e1UPy4LXVMuK8F8PU3t';
        const REDIRECT_URI = window.location.href.split('?')[0];

        // Passo 1: Envia o usuário para o site da Deriv
        function iniciarLogin() {
            const authUrl = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=pt`;
            window.location.href = authUrl;
        }

        // Passo 2: Verifica automaticamente se o usuário voltou logado
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token1'); // A Deriv devolve o token na URL

            if (token) {
                // Se existe token na URL, autentica imediatamente
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('loading-section').classList.remove('hidden');
                conectar(token);
            }
        };

        function conectar(token) {
            const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);

            ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);

                if (data.error) {
                    alert("Erro na Autenticação: " + data.error.message);
                    window.location.href = REDIRECT_URI;
                    return;
                }

                if (data.msg_type === 'authorize') {
                    document.getElementById('auth-card').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    document.getElementById('acc-type').innerText = data.authorize.is_virtual ? "Conta Demo" : "Conta Real";
                    
                    // Solicita o saldo para confirmar a conexão
                    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                }

                if (data.msg_type === 'balance') {
                    document.getElementById('balance-display').innerText = `$ ${data.balance.balance.toFixed(2)}`;
                }
            };
        }

        function logout() {
            window.location.href = REDIRECT_URI;
        }
    </script>
</body>
</html>
