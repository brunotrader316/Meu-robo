<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision | Neural Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
        .neon-border { border: 1px solid rgba(34, 211, 238, 0.2); box-shadow: 0 0 20px rgba(6, 182, 212, 0.1); }
        .bg-cyber { background: radial-gradient(circle at top right, #0f172a, #020617); }
        .btn-glow { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); transition: 0.3s; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(6, 182, 212, 0.4); }
        .terminal-log { background: #010409; font-family: 'Fira Code', monospace; font-size: 11px; height: 250px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-cyber p-4">

    <div id="app-container" class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 gap-6 animate-fadeIn">
        
        <div class="md:col-span-5 space-y-6">
            <div class="bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl neon-border">
                <div class="flex items-center gap-3 mb-8">
                    <div class="p-3 bg-cyan-500/20 rounded-2xl border border-cyan-500/30">
                        <i class="fas fa-brain text-cyan-400 text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black italic uppercase tracking-tighter">Expert <span class="text-cyan-400">Vision</span></h1>
                        <p class="text-[9px] text-slate-500 font-bold tracking-widest uppercase">Protocolo Neural v4.0</p>
                    </div>
                </div>

                <div id="auth-section" class="space-y-4">
                    <button onclick="autenticar()" class="w-full py-4 btn-glow rounded-2xl font-black uppercase text-sm flex items-center justify-center gap-3">
                        <i class="fas fa-fingerprint"></i> Autenticação Biométrica
                    </button>
                    <p class="text-[9px] text-center text-slate-600 uppercase font-bold italic">Conexão criptografada via OAuth 2.0 PKCE</p>
                </div>

                <div id="bot-controls" class="hidden space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-center">
                            <span class="text-[9px] text-slate-500 uppercase font-bold">Saldo</span>
                            <p id="balance-val" class="text-lg font-black text-white font-mono">$ 0.00</p>
                        </div>
                        <div id="status-led" class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-center">
                            <span class="text-[9px] text-slate-500 uppercase font-bold">Status</span>
                            <p class="text-[10px] font-black text-cyan-400 uppercase">Online</p>
                        </div>
                    </div>
                    <button onclick="toggleBot()" id="btn-bot" class="w-full py-4 bg-green-600 rounded-2xl font-black uppercase text-sm shadow-lg shadow-green-900/20">
                        Iniciar Operações
                    </button>
                </div>
            </div>
        </div>

        <div class="md:col-span-7">
            <div class="bg-slate-900/80 backdrop-blur-xl rounded-3xl neon-border h-full flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/50">
                    <span class="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-500 animate-ping"></span> Live Market Feed
                    </span>
                    <span class="text-[10px] font-mono text-cyan-500/50">APP_ID: 33e1UPy4LXVMuK8F8PU3t</span>
                </div>
                <div id="logs" class="terminal-log p-6 overflow-y-auto space-y-2 flex-1">
                    <div class="text-cyan-500/40 italic">> Sistema inicializado. Aguardando pulso de autenticação...</div>
                </div>
                <div class="p-4 bg-slate-950/80 border-t border-slate-800 grid grid-cols-3 gap-2">
                    <div class="text-center"><span class="text-[9px] text-slate-500 block uppercase">Wins</span><span id="wins" class="font-bold text-green-400">0</span></div>
                    <div class="text-center"><span class="text-[9px] text-slate-500 block uppercase">Losses</span><span id="losses" class="font-bold text-red-400">0</span></div>
                    <div class="text-center"><span class="text-[9px] text-slate-500 block uppercase">V-Loss</span><span id="v-loss" class="font-bold text-white">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '33eu4HBakeGnrJSiITpaR';
        const REDIRECT_URI = 'https://brunotrader316.github.io/Meu-robo';
        let ws, running = false;

        async function autenticar() {
            // Geração de PKCE conforme o guia OAuth 2.0 enviado
            const array = crypto.getRandomValues(new Uint8Array(64));
            const verifier = Array.from(array).map(v => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[v % 66]).join('');
            const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
            const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const state = Math.random().toString(36).substring(2);

            sessionStorage.setItem('pkce_code_verifier', verifier);
            
            const authUrl = `https://auth.deriv.com/oauth2/auth?` + 
                `response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&scope=trade+account_manage+payments&state=${state}&code_challenge=${challenge}&code_challenge_method=S256`;
            
            window.location.href = authUrl;
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (code) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('bot-controls').classList.remove('hidden');
                addLog("Handshake OAuth detectado. Sincronizando...", "text-cyan-400");
                iniciarConexao(code);
            }
        };

        function iniciarConexao(code) {
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${CLIENT_ID}`);
            ws.onopen = () => ws.send(JSON.stringify({ authorize: code, code_verifier: sessionStorage.getItem('pkce_code_verifier') }));
            
            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data.msg_type === 'authorize') {
                    addLog("Conexão Neural Estabelecida!", "text-green-400 font-bold");
                    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                }
                if (data.msg_type === 'balance') {
                    document.getElementById('balance-val').innerText = `$ ${data.balance.balance.toFixed(2)}`;
                }
            };
        }

        function addLog(msg, color) {
            const logs = document.getElementById('logs');
            const d = document.createElement('div');
            d.className = `${color} border-l-2 border-slate-800 pl-3 py-1`;
            d.innerHTML = `<span class="text-slate-700 mr-2">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logs.prepend(d);
        }
    </script>
</body>
</html>
