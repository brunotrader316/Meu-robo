<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision | Ultra Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .panel-glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .card-stat { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; }
        .btn-primary { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); transition: 0.4s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3); }
        .input-dark { background: #020617; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 10px; width: 100%; outline: none; text-align: center; }
        .input-dark:focus { border-color: #22d3ee; box-shadow: 0 0 10px rgba(34, 211, 238, 0.1); }
        .log-container { height: 200px; font-family: 'Fira Code', monospace; font-size: 11px; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="max-w-6xl w-full mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <div class="p-3 bg-cyan-500/20 rounded-2xl border border-cyan-500/30">
                <i class="fas fa-bolt text-cyan-400 text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter uppercase">Expert <span class="text-cyan-400">Vision</span></h1>
                <p class="text-[10px] text-slate-500 font-bold tracking-widest">SISTEMA DE ALTA PERFORMANCE</p>
            </div>
        </div>
        <div class="text-right">
            <span id="conn-status" class="text-[10px] font-bold text-red-500 uppercase tracking-widest">• Desconectado</span>
            <h2 id="balance-val" class="text-3xl font-black font-mono">$ 0.00</h2>
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <aside class="lg:col-span-4 space-y-6">
            <section class="panel-glass p-6 rounded-3xl shadow-xl">
                <h3 class="text-xs font-black text-slate-400 uppercase mb-4 flex items-center gap-2">
                    <i class="fas fa-key text-cyan-400"></i> Autenticação
                </h3>
                <input id="api-token" type="password" oninput="autoAuth()" placeholder="Insira o Token API" class="input-dark mb-2">
                <p class="text-[9px] text-slate-500 italic">A verificação é automática ao colar o token.</p>
            </section>

            <section class="panel-glass p-6 rounded-3xl shadow-xl space-y-4">
                <h3 class="text-xs font-black text-slate-400 uppercase mb-2 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-cyan-400"></i> Configurações Base
                </h3>
                
                <div>
                    <label class="text-[10px] text-slate-500 uppercase font-bold ml-1">Estratégia</label>
                    <select id="strategy" class="input-dark mt-1 text-sm bg-slate-900">
                        <option value="diff">Dígitos Diferentes (Segura)</option>
                        <option value="match">Dígitos Iguais (Alta Rentabilidade)</option>
                        <option value="over">Dígitos Over 2 (Tendência)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] text-slate-500 uppercase font-bold ml-1">Entrada ($)</label>
                        <input id="stake" type="number" value="0.35" class="input-dark mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 uppercase font-bold ml-1">V-Loss</label>
                        <input id="v-limit" type="number" value="3" class="input-dark mt-1">
                    </div>
                </div>

                <button id="btn-bot" onclick="startBot()" class="btn-primary w-full py-4 rounded-xl font-black uppercase text-sm mt-4">
                    <i class="fas fa-play mr-2"></i> Iniciar Algoritmo
                </button>
            </section>
        </aside>

        <div class="lg:col-span-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="card-stat flex flex-col items-center">
                    <span class="text-[10px] text-slate-500 font-bold uppercase">Vitórias</span>
                    <span id="wins" class="text-3xl font-black text-green-400">0</span>
                </div>
                <div class="card-stat flex flex-col items-center">
                    <span class="text-[10px] text-slate-500 font-bold uppercase">Derrotas</span>
                    <span id="losses" class="text-3xl font-black text-red-400">0</span>
                </div>
                <div class="card-stat flex flex-col items-center border-cyan-500/30">
                    <span class="text-[10px] text-cyan-400 font-bold uppercase">Análise V-Loss</span>
                    <span id="v-count" class="text-3xl font-black text-white">0</span>
                </div>
            </div>

            <section class="panel-glass p-6 rounded-3xl h-[335px] flex flex-col">
                <h3 class="text-xs font-black text-slate-400 uppercase mb-4 border-b border-slate-800 pb-2">Log de Operações em Tempo Real</h3>
                <div id="logs" class="log-container overflow-y-auto space-y-2 pr-2">
                    <div class="text-slate-600">Aguardando conexão com App ID 33e1UPy4LXVMuK8F8PU3t...</div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const APP_ID = '33e1UPy4LXVMuK8F8PU3t';
        let ws, running = false, vCounter = 0, currentStake = 0, activeToken = "";

        function autoAuth() {
            const token = document.getElementById('api-token').value.trim();
            if(token.length >= 15 && token !== activeToken) {
                activeToken = token;
                initConnection(token);
            }
        }

        function initConnection(token) {
            if(ws) ws.close();
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
            
            ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if(data.error) return addLog(`ERRO: ${data.error.message}`, "text-red-500");

                if(data.msg_type === 'authorize') {
                    document.getElementById('conn-status').innerText = data.authorize.is_virtual ? "• CONTA DEMO" : "• CONTA REAL";
                    document.getElementById('conn-status').className = "text-[10px] font-bold text-cyan-400 uppercase tracking-widest";
                    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                    addLog("Autenticado com sucesso!", "text-green-400 font-bold");
                }

                if(data.msg_type === 'balance') {
                    document.getElementById('balance-val').innerText = `$ ${data.balance.balance.toFixed(2)}`;
                }

                if(data.msg_type === 'tick' && running) {
                    processStrategy(data.tick.quote.toString().slice(-1));
                }

                if(data.msg_type === 'proposal_open_contract' && data.proposal_open_contract.is_settled) {
                    handleResult(data.proposal_open_contract.status === 'won');
                }
            };
        }

        function startBot() {
            if(!ws || ws.readyState !== 1) return alert("Cole o Token primeiro!");
            running = !running;
            document.getElementById('btn-bot').innerText = running ? "PARAR ALGORITMO" : "INICIAR ALGORITMO";
            document.getElementById('btn-bot').className = running ? "w-full py-4 rounded-xl bg-red-600 font-black uppercase text-sm mt-4" : "btn-primary w-full py-4 rounded-xl font-black uppercase text-sm mt-4";
            
            if(running) {
                currentStake = parseFloat(document.getElementById('stake').value);
                ws.send(JSON.stringify({ ticks: "R_100", subscribe: 1 }));
                addLog("Analisando padrões de mercado...", "text-cyan-400");
            }
        }

        function processStrategy(digit) {
            const strategy = document.getElementById('strategy').value;
            const limit = parseInt(document.getElementById('v-limit').value);
            
            addLog(`Tick analisado: ${digit}`, "text-slate-500");

            if(strategy === 'diff') {
                if(digit == "9") vCounter++;
                if(vCounter >= limit) executeTrade("DIGITDIFF", "9");
            } else if(strategy === 'match') {
                if(digit == "0") vCounter++;
                if(vCounter >= limit) executeTrade("DIGITMATCH", "0");
            } else if(strategy === 'over') {
                if(parseInt(digit) <= 2) vCounter++;
                if(vCounter >= limit) executeTrade("DIGITOVER", "2");
            }
            
            document.getElementById('v-count').innerText = vCounter;
        }

        function executeTrade(type, barrier) {
            ws.send(JSON.stringify({
                "buy": 1, "price": currentStake,
                "parameters": {
                    "amount": currentStake, "basis": "stake", "contract_type": type,
                    "currency": "USD", "duration": 1, "duration_unit": "t",
                    "symbol": "R_100", "barrier": barrier
                }
            }));
            vCounter = 0;
            addLog(`ORDEM ENVIADA: ${type}`, "text-white font-bold bg-cyan-900/40 p-1");
        }

        function handleResult(win) {
            if(win) {
                document.getElementById('wins').innerText = parseInt(document.getElementById('wins').innerText) + 1;
                currentStake = parseFloat(document.getElementById('stake').value);
                addLog("VITÓRIA CONFIRMADA!", "text-green-400 font-bold");
            } else {
                document.getElementById('losses').innerText = parseInt(document.getElementById('losses').innerText) + 1;
                currentStake *= 11; // Multiplicador para Diferente
                addLog(`LOSS DETECTADO. Aplicando Gale: $${currentStake.toFixed(2)}`, "text-red-400");
            }
        }

        function addLog(msg, color) {
            const logs = document.getElementById('logs');
            const d = document.createElement('div');
            d.className = `${color} border-b border-slate-800 pb-1`;
            d.innerHTML = `<span class="text-slate-600">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logs.prepend(d);
        }
    </script>
</body>
</html>
