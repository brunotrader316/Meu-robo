<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expert Vision | Neural System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(34, 211, 238, 0.1); }
        .input-cyber { background: #010409; border: 1px solid #1e3a5f; color: #22d3ee; outline: none; transition: 0.3s; }
        .input-cyber:focus { border-color: #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
        .btn-glow { background: linear-gradient(135deg, #0891b2 0%, #2563eb 100%); transition: 0.3s; font-weight: 900; }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(8, 145, 178, 0.4); }
        .hidden-step { display: none !important; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 bg-black">

    <div id="site-login-screen" class="w-full max-w-md glass p-10 rounded-[2.5rem] text-center border-t-4 border-cyan-500 shadow-2xl">
        <div class="mb-8">
            <div class="w-16 h-16 bg-cyan-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-cyan-500/30">
                <i class="fas fa-user-shield text-cyan-400 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-white">Expert <span class="text-cyan-400">Vision</span></h1>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-2">Área do Cliente</p>
        </div>
        <div class="space-y-4">
            <input id="client-id" type="text" placeholder="Seu Usuário de Acesso" class="input-cyber w-full p-4 rounded-xl text-sm text-center">
            <button onclick="acessarSistema()" class="btn-glow w-full py-4 rounded-xl uppercase text-xs tracking-widest text-white">Entrar no Site</button>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden-step w-full max-w-6xl grid grid-cols-12 gap-6 h-[90vh]">
        
        <aside class="col-span-12 lg:col-span-4 flex flex-col gap-4">
            <div class="glass p-8 rounded-[2rem] flex-1 flex flex-col gap-6">
                <div class="flex items-center gap-4 text-white">
                    <i class="fas fa-link text-cyan-400 text-xl"></i>
                    <h3 class="text-sm font-black uppercase">Autenticação Deriv</h3>
                </div>

                <div class="space-y-4">
                    <button onclick="conectarViaOAuth()" class="w-full py-4 bg-white text-black rounded-xl font-black text-[10px] uppercase flex items-center justify-center gap-3 hover:bg-slate-200 transition">
                        <img src="https://deriv.com/static/00742f9b1c7f99990b790d97034b1593/deriv-logo-c2.svg" class="w-16">
                        Logar na Deriv
                    </button>
                    
                    <div id="status-box" class="p-4 bg-slate-950/80 rounded-xl border border-slate-800 flex items-center gap-3">
                        <div id="status-led" class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-[0_0_8px_red]"></div>
                        <span id="status-label" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Aguardando Autorização</span>
                    </div>
                </div>

                <button id="btn-play" disabled class="btn-glow w-full py-5 rounded-2xl uppercase text-sm mt-auto opacity-20 cursor-not-allowed text-white">
                    <i class="fas fa-play mr-2"></i> Iniciar Algoritmo
                </button>
            </div>
        </aside>

        <main class="col-span-12 lg:col-span-8 flex flex-col gap-4">
            <div class="grid grid-cols-3 gap-4">
                <div class="glass p-6 rounded-[2rem] text-center border-b-2 border-green-500/30 text-white">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Total Wins</p>
                    <h4 id="wins" class="text-3xl font-black text-green-400">0</h4>
                </div>
                <div class="glass p-6 rounded-[2rem] text-center border-b-2 border-red-500/30 text-white">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Total Losses</p>
                    <h4 id="losses" class="text-3xl font-black text-red-400">0</h4>
                </div>
                <div class="glass p-6 rounded-[2rem] text-center border-b-2 border-cyan-500/30 text-white">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Saldo Atual</p>
                    <h4 id="balance" class="text-3xl font-black text-white font-mono">$ 0.00</h4>
                </div>
            </div>

            <div class="glass p-8 rounded-[2.5rem] flex-1 flex flex-col overflow-hidden">
                <div id="console-logs" class="flex-1 overflow-y-auto font-mono text-[11px] space-y-2 text-slate-400">
                    <div class="text-cyan-500/50 italic font-mono">> Expert Vision v2.0 carregado.</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const APP_ID = '33e1UPy4LXVMuK8F8PU3t';
        let ws;

        // ETAPA 1: LOGIN NO SEU SITE
        function acessarSistema() {
            const user = document.getElementById('client-id').value;
            if(!user) return alert("Por favor, digite seu usuário.");
            
            // Salva o login para não pedir de novo ao voltar da Deriv
            sessionStorage.setItem('site_logged', 'true');
            mostrarDashboard();
        }

        function mostrarDashboard() {
            document.getElementById('site-login-screen').classList.add('hidden-step');
            document.getElementById('dashboard-screen').classList.remove('hidden-step');
        }

        // ETAPA 2: DIRECIONAR PARA A TELA DE "PERMITIR ACESSO"
        function conectarViaOAuth() {
            // URL EXATA PARA FUNCIONAR COM O SEU APP_ID
            const authUrl = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=PT&brand=deriv`;
            window.location.href = authUrl;
        }

        // ETAPA 3: CAPTURA DO TOKEN NO RETORNO (O "PULO DO GATO")
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenRetornado = urlParams.get('token1');
            const logadoNoSite = sessionStorage.getItem('site_logged');

            if (tokenRetornado) {
                // Se voltou da Deriv com o token, abre o dashboard e conecta
                mostrarDashboard();
                validarToken(tokenRetornado);
            } else if (logadoNoSite === 'true') {
                // Se já tinha logado no site mas não tem token, mostra o dashboard
                mostrarDashboard();
            }
        };

        function validarToken(token) {
            addLog("Sincronizando chave de acesso com a Deriv...", "text-yellow-500");
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
            
            ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data.error) {
                    addLog("ERRO DE AUTENTICAÇÃO: " + data.error.message, "text-red-500");
                    return;
                }
                if (data.msg_type === 'authorize') {
                    addLog("CONEXÃO ESTABELECIDA COM SUCESSO!", "text-green-400 font-bold");
                    
                    // Atualiza o Visual do Painel
                    document.getElementById('status-led').className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]";
                    document.getElementById('status-label').innerText = data.authorize.is_virtual ? "CONTA DEMO ATIVA" : "CONTA REAL ATIVA";
                    document.getElementById('status-label').className = "text-[9px] font-bold text-green-400 uppercase tracking-widest";
                    
                    const btn = document.getElementById('btn-play');
                    btn.disabled = false;
                    btn.className = "btn-glow w-full py-5 rounded-2xl uppercase text-sm mt-auto text-white";
                    
                    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                }
                if (data.msg_type === 'balance') {
                    document.getElementById('balance').innerText = `$ ${data.balance.balance.toFixed(2)}`;
                }
            };
        }

        function addLog(msg, color = "text-slate-500") {
            const logs = document.getElementById('console-logs');
            const d = document.createElement('div');
            d.className = color + " border-l border-slate-800 pl-3 py-1";
            d.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.prepend(d);
        }
    </script>
</body>
</html>
